spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/process_mining
    username: process_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  application:
    name: process-mining
server:
  error:
    include-stacktrace: never
    include-exception: false
